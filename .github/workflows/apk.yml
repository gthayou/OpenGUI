name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: SERVER_URL
        required: true
        default: http://100.82.146.118:7777

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure
        working-directory: client
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "SERVER_URL=${{ inputs.server_url }}" >> local.properties
          chmod +x gradlew
      - name: Build
        working-directory: client
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: client/app/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: client/app/build/outputs/apk/debug/app-debug.apk
